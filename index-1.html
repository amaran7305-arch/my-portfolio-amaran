<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fun Facts Generator 🤖</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0d1117;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      color: white;
    }

    .badge {
      background: #238636;
      color: white;
      font-size: 0.75rem;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      margin-bottom: 1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #58a6ff, #bf91f3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.sub {
      color: #8b949e;
      text-align: center;
      margin-bottom: 2rem;
      font-size: 1rem;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 2rem;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      min-height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .emoji {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .fact-text {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #e6edf3;
    }

    .category {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #58a6ff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn {
      margin-top: 1.5rem;
      background: linear-gradient(135deg, #238636, #2ea043);
      color: white;
      border: none;
      padding: 0.85rem 2.5rem;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(35,134,54,0.4);
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .counter {
      margin-top: 1.5rem;
      color: #8b949e;
      font-size: 0.85rem;
    }

    footer {
      margin-top: 3rem;
      color: #8b949e;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="badge">🤖 Built with Copilot</div>
  <h1>Fun Facts Generator</h1>
  <p class="sub">Discover something amazing every tap!</p>

  <div class="card">
    <div class="emoji" id="emoji">🌍</div>
    <div class="fact-text" id="fact">Hit the button below to get your first fun fact!</div>
    <div class="category" id="category"></div>
  </div>

  <button class="btn" onclick="newFact()">✨ Show Me a Fact!</button>

  <div class="counter" id="counter">Facts discovered: 0</div>

  <footer>#MyFirstWebsite • Made with GitHub Copilot 🚀</footer>

  <script>
    const facts = [
      { emoji: "🐙", text: "Octopuses have three hearts, blue blood, and can edit their own RNA.", category: "Animals" },
      { emoji: "🌍", text: "A day on Venus is longer than a year on Venus.", category: "Space" },
      { emoji: "🍯", text: "Honey never expires. Archaeologists found 3000-year-old honey in Egyptian tombs — still edible!", category: "Food" },
      { emoji: "🧠", text: "Your brain generates enough electricity to power a small light bulb.", category: "Human Body" },
      { emoji: "🦈", text: "Sharks are older than trees. They've existed for over 450 million years.", category: "Animals" },
      { emoji: "🌊", text: "More than 80% of the world's oceans remain unexplored.", category: "Earth" },
      { emoji: "🔥", text: "Hot water can freeze faster than cold water — this is called the Mpemba effect.", category: "Science" },
      { emoji: "🦋", text: "Butterflies taste with their feet using sensors on their legs.", category: "Animals" },
      { emoji: "🌙", text: "The Moon is slowly moving away from Earth at about 3.8 cm per year.", category: "Space" },
      { emoji: "🧊", text: "Antarctica is the largest desert in the world, not the Sahara.", category: "Earth" },
      { emoji: "⚡", text: "Lightning strikes the Earth about 100 times every single second.", category: "Weather" },
      { emoji: "🐘", text: "Elephants are the only animals that can't jump — but they can swim!", category: "Animals" },
      { emoji: "💻", text: "The first computer bug was an actual bug — a moth found in a Harvard computer in 1947.", category: "Technology" },
      { emoji: "🌺", text: "Bamboo is the fastest-growing plant on Earth, growing up to 91 cm in a single day.", category: "Plants" },
      { emoji: "🎵", text: "Music can change your heart rate and breathing to sync with its rhythm.", category: "Human Body" },
    ];

    let count = 0;
    let lastIndex = -1;

    function newFact() {
      let index;
      do { index = Math.floor(Math.random() * facts.length); }
      while (index === lastIndex);
      lastIndex = index;

      const f = facts[index];
      document.getElementById('emoji').textContent = f.emoji;
      document.getElementById('fact').textContent = f.text;
      document.getElementById('category').textContent = '📂 ' + f.category;
      count++;
      document.getElementById('counter').textContent = `Facts discovered: ${count}`;
    }
  </script>

</body>
</html>
